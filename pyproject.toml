[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastability-limits-proxy-bciaut-p300"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyriemann",
    "matplotlib",
    "seaborn",
    "mat73",
    "torch",
    "ruptures",
]

[project.urls]
Repository = "https://github.com/ada-teodorescu/forecastability-limits-proxy-bciaut-p300"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_full_data: requires artifacts generated by the complete EEG pipeline"]

[dependency-groups]
dev = ["pytest==9.0.2"]
